<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — Handcraftbandit</title>
<meta name="description" content="Thank you for your order from Handcraftbandit, Irish Belt House, Midleton.">
<meta name="theme-color" content="#16110D">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2316110D'/><text x='50' y='68' font-family='Georgia,serif' font-size='62' fill='%23A6855C' text-anchor='middle'>H</text></svg>">
<link rel="stylesheet" href="styles.css">
<style>
  /* Centre the message on a full-height dark oak ground, reusing the design tokens */
  .thanks{
    min-height:100svh; display:flex; align-items:center; justify-content:center;
    background:var(--oak-900); color:var(--cream); text-align:center;
    padding:var(--pad);
  }
  .thanks .inner{ max-width:640px; }
  .thanks .display{ margin:18px 0 22px; }
  .thanks .body-copy{ margin-inline:auto; color:var(--cream-70); }
  .thanks .actions{ justify-content:center; margin-top:clamp(30px,4vw,44px); }
</style>
</head>
<body>
  <main class="thanks" id="top">
    <div class="inner">
      <p class="eyebrow eyebrow--center">Order received</p>
      <h1 class="display">Thank you.</h1>
      <div class="body-copy">
        <p>Your order is confirmed and your receipt is on its way by email from Square. Each piece is made and finished by hand in Midleton — we'll be in touch if we need anything from you.</p>
        <p>Built to be repaired. Not replaced.</p>
      </div>
      <div class="actions">
        <a href="/" class="btn btn--ghost-light btn--arrow">Return to Handcraftbandit</a>
      </div>
    </div>
  </main>
</body>
</html>
